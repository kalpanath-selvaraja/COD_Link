<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function() {
        const BASE_URL = '';

        const token = localStorage.getItem('codlink_jwt_token') || localStorage.getItem('JWT');
        if (!token) {
            window.location.href = '../login.html';
            return;
        }

        const ajaxHeaders = {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        };

        function isOk(res) { return res && res.status === 0; }

        function handleAuthFailure(xhr) {
            if (xhr && (xhr.status === 401)) {
                alert('Session expired. Please log in again.');
                localStorage.clear(); sessionStorage.clear();
                window.location.href = '../login.html';
                return true;
            }
            return false;
        }

        function getCachedCustomerId() {
            return localStorage.getItem('customer_id');
        }

        function ensureCustomerId() {
            const cached = getCachedCustomerId();
            if (cached){
                return $.Deferred().resolve(cached).promise();
            } else{
                return $.ajax({ url: BASE_URL + '/api/customers/me', method: 'GET', headers: ajaxHeaders })
                    .then(res => {
                        if (!isOk(res)) throw new Error(res.message || 'No customer profile found');
                        localStorage.setItem('customer_id', res.body.customerId);
                        return res.body.customerId;
                    });
            }

        }

        localStorage.getItem('username')

        const name = localStorage.getItem('username') || 'Unknown User';
        const role = localStorage.getItem('Role') || 'USER';

        $('#user-display').text(name);
        $('.user-avatar').text(name.substring(0, 2).toUpperCase());

        const $badge = $('.user-badge');
        const cleanRole = role.replace('ROLE_', '').toUpperCase();
        $badge.text(cleanRole);

        if (cleanRole === 'ADMIN') {
            $badge.css({ 'background-color': 'var(--color-vermillion-signal, #e42b0c)', 'color': '#fff' });
        } else if (cleanRole === 'STAFF' || cleanRole === 'RECEPTIONIST') {
            $badge.css({ 'background-color': '#f59e0b', 'color': '#fff' });
        } else {
            $badge.css({ 'background-color': 'var(--color-cloud, #d4d4d4)', 'color': '#101828' });
        }

        // 2. Fetch and Render Parcel History Table — now uses the customer's
        // own parcels via /api/parcels/customer/{id}, not the admin-only
        // /api/parcels endpoint this page was calling before.
        function loadParcelHistory() {
            const $tbody = $('#parcel-history-table-body');
            $tbody.html('<tr><td colspan="7" style="text-align: center;">Loading data...</td></tr>');

            ensureCustomerId().then(customerId => {
                return $.ajax({ url: BASE_URL + '/api/parcels/customer/' + customerId, method: 'GET', headers: ajaxHeaders });
            }).then(response => {
                if (!isOk(response)) {
                    $tbody.html(`<tr><td colspan="7" style="text-align: center;">${escapeHtml(response.message)}</td></tr>`);
                    return;
                }

                const parcels = response.body;
                $tbody.empty();

                if (!Array.isArray(parcels) || parcels.length === 0) {
                    $tbody.append('<tr><td colspan="7" style="text-align: center;">No parcel history found.</td></tr>');
                    return;
                }

                parcels.forEach(function(parcel) {
                    let statusClass = 'status-pending';
                    if (parcel.status === 'IN_TRANSIT') statusClass = 'status-in-transit';
                    if (parcel.status === 'DELIVERED') statusClass = 'status-delivered';
                    if (parcel.status === 'FAILED') statusClass = 'status-failed';
                    if (parcel.status === 'RETURNED') statusClass = 'status-transfer';

                    const $tr = $('<tr>');
                    $tr.append($('<td>').text('#' + parcel.parcelId));
                    $tr.append($('<td>').append($('<strong>').text(parcel.trackingNumber || 'N/A')));
                    $tr.append($('<td>').text(parcel.customerName || 'You'));

                    const weight = parcel.weight ? parcel.weight + ' kg' : '--';
                    $tr.append($('<td>').text(weight));

                    const cod = parcel.codAmount ? '$' + parseFloat(parcel.codAmount).toFixed(2) : '--';
                    $tr.append($('<td>').text(cod));

                    const $statusSpan = $('<span>').addClass('status-pill ' + statusClass).text(parcel.status || 'PENDING');
                    $tr.append($('<td>').append($statusSpan));

                    $tr.append($('<td>').text('#' + (parcel.shipmentId || 'N/A')));

                    $tbody.append($tr);
                });
            }).catch(err => {

                if (err && err.status && handleAuthFailure(err)) return;

                $tbody.html(`<tr><td colspan="7" style="text-align: center; color:red;">${escapeHtml(err.message || err.statusText || 'Failed to load parcel history.')}</td></tr>`);
            });
        }

        // 3. Initialization and Event Listeners
        loadParcelHistory();

        $('#btn-refresh').on('click', function() {
            const $btn = $(this);
            $btn.css('opacity', '0.5');
            loadParcelHistory();
            setTimeout(() => $btn.css('opacity', '1'), 400);
        });

        $('#btn-logout').on('click', function() {
            localStorage.removeItem('codlink_jwt_token');
            localStorage.removeItem('JWT');
            window.location.href = '../login.html';
        });
    });
</script>
<script src="/js/notifications.js"></script>
