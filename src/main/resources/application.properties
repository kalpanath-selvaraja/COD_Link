#Create a .env file or update this  file to tour preference.

spring.application.name=codlink
spring.config.import=optional:file:.env[.properties]
# This tell the spring to import the .env file , as a new property file and  place it a head oof application.properties in the order
#So now when Spring loads, it first checks the .env file and if something is not present it will come to application.properties.
# Even if it is not there it will throw an error.

spring.datasource.url=YOUR_DATA_SOURCE_URL(jdbc:mysql://localhost:YOUR_PORT_NUMBER/YOUR_DATABASE)
# Example: spring.datasource.url=jdbc:mysql://localhost:3306/codlink_db

spring.jpa.hibernate.ddl-auto=update
#CHANGE TO YOUR PREFERENCE

spring.jpa.show-sql=false 
#CHANGE TO YOUR PREFERENCE

spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD

app.default-admin.username=YOUR_PREFERRED_DEFAULT_ADMIN_USERNAME
app.default-admin.password=YOUR_PREFERRED_DEFAULT_ADMIN_PASSWORD

jwt.secret=YOUR_JWT_SECRET_KEY
jwt.expiration=YOUR_JWT_EXPIRATION

spring.ai.google.genai.api-key=YOUR_GEMINI_API_KEY
spring.ai.google.genai.chat.model=YOUR_GEMINI_MODEL